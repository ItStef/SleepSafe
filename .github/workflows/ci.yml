name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sleepsafe
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: sleepsafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleepsafe -d sleepsafe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        env:
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sleepsafe:ci-password@localhost:5432/sleepsafe
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_UI_PORT: 8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @sleepsafe/api db:deploy
      - run: pnpm typecheck
      - run: pnpm --filter @sleepsafe/web build
      - run: pnpm test

  # Isto na macOS-u (Apple Silicon): instalacija, lint, tipovi, build i testovi koji ne traze
  # bazu. Testovi sa bazom se preskacu (bez DATABASE_URL), a Prisma klijent se generise.
  macos:
    runs-on: macos-latest
    env:
      DATABASE_URL: postgresql://sleepsafe:ci-password@localhost:5432/sleepsafe
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @sleepsafe/web build
      - run: pnpm --filter @sleepsafe/shared test
      - run: pnpm --filter @sleepsafe/crypto test
      - run: pnpm --filter @sleepsafe/web test
      - run: DATABASE_URL= pnpm --filter @sleepsafe/api exec vitest run
      - run: node scripts/check-env.mjs || true

  # Slike za API i veb moraju da se grade i za amd64 i za arm64 (Mac sa Apple Silicon cipom).
  docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Ceo sistem u kontejnerima se podize i odgovara preko HTTPS-a sa zaglavljima zastite.
  stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.demo.yml --profile app
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: $COMPOSE up -d --build
      - name: Cekanje da sistem odgovori
        run: |
          for i in $(seq 1 60); do
            curl -ksf https://localhost/health && exit 0
            sleep 2
          done
          exit 1
      - name: Provera zaglavlja
        run: |
          headers="$(curl -ksI https://localhost/)"
          echo "$headers"
          echo "$headers" | grep -i "content-security-policy: .*wasm-unsafe-eval"
          echo "$headers" | grep -i "x-content-type-options: nosniff"
          curl -ksf https://localhost/ | grep -q '<div id="root">'
      - if: failure()
        run: $COMPOSE logs --tail=200
      - if: always()
        run: $COMPOSE down -v
