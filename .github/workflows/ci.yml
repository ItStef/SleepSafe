name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sleepsafe
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: sleepsafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleepsafe -d sleepsafe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        env:
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sleepsafe:ci-password@localhost:5432/sleepsafe
      MAILPIT_SMTP_PORT: 1025
      MAILPIT_UI_PORT: 8025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @sleepsafe/api db:deploy
      - run: pnpm typecheck
      - run: pnpm test
